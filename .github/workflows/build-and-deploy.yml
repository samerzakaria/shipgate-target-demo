# Target-side: build -> attest -> deploy through a gated environment.
# Actions pinned by immutable commit SHA (verify pins on adoption).
name: build and deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "deployment environment"
        required: false
        default: "production"
permissions:
  id-token: write
  contents: read
  attestations: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the release artifact
        run: |
          mkdir -p dist
          tar -czf dist/release.tgz README.md 2>/dev/null || \
            { echo "ship-gate validation artifact $GITHUB_SHA" > dist/note.txt; \
              tar -czf dist/release.tgz dist/note.txt; }
          sha256sum dist/release.tgz
      - name: Attest build provenance (GitHub artifact attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: dist/release.tgz
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Deploy (the gated act itself)
        run: echo "deployed $GITHUB_SHA run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT to ${{ inputs.environment }}"
