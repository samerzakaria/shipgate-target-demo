name: build and deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: deployment environment
        required: false
        default: production

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact_digest: ${{ steps.digest.outputs.sha256 }}
      decision_digest: ${{ steps.decide.outputs.decision_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Prepare the pinned containment image and external held-out vault
        env:
          RUNNER_IMAGE: python:3.12-bookworm@sha256:3cd9086bdb30f7c9bc08a3fa621d9842e0d3f6f9291aeb4677e0547817c10b12
        run: |
          set -euo pipefail
          docker pull "$RUNNER_IMAGE"
          chmod -R a+rwX "$GITHUB_WORKSPACE"
          VAULT="$RUNNER_TEMP/shipgate-heldout-vault"
          mkdir -p "$VAULT/heldout/heldout"
          cat > "$VAULT/heldout/heldout/test_composition.py" <<'PY'
          import json
          from service import add
          ok = add(add(1, 2), 3) == 6
          print(json.dumps({"numTotalTests": 1, "numPassedTests": int(ok),
                            "numFailedTests": int(not ok),
                            "numRuntimeErrorTestSuites": 0}))
          raise SystemExit(0 if ok else 1)
          PY
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          vault = pathlib.Path(os.environ["RUNNER_TEMP"]) / "shipgate-heldout-vault"
          rel = "heldout/test_composition.py"
          digest = hashlib.sha256((vault / "heldout" / rel).read_bytes()).hexdigest()
          (vault / "heldout-manifest.json").write_text(json.dumps({
              "heldout_files": [rel], "heldout_sha": {rel: digest},
              "suites": [{"suiteId": "composition", "files": [rel]}],
          }))
          PY
          cat > "$RUNNER_TEMP/shipgate-options.json" <<JSON
          {
            "base_url": "http://127.0.0.1:8765",
            "routes": [{"method": "GET", "path": "/health"}],
            "cujs": [{"id": "health", "title": "Health is served", "method": "GET", "path": "/health"}],
            "vault": "$VAULT",
            "heldout_cmd": "python3 heldout/test_composition.py",
            "test_cmd": "python3 -m unittest discover -s tests -v",
            "mutation_tool": "stryker",
            "max_faults": 2,
            "security_allow_partial": true
          }
          JSON

      - name: Build the release artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          printf 'ship-gate positive candidate %s\n' "$GITHUB_SHA" > dist/release.txt
          tar -czf dist/release.tgz -C dist release.txt
          rm dist/release.txt

      - name: Record the artifact digest
        id: digest
        run: |
          SHA=$(sha256sum dist/release.tgz | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Start the disposable reference service
        run: |
          python3 service.py 8765 > "$RUNNER_TEMP/service.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/service.pid"
          for i in $(seq 1 50); do
            curl --fail --silent http://127.0.0.1:8765/health && exit 0
            sleep 0.2
          done
          exit 1

      - name: Collect clean semantic round one
        env:
          SHIPGATE_EXEC_MODE: container
          SHIPGATE_RUNNER_IMAGE: python:3.12-bookworm@sha256:3cd9086bdb30f7c9bc08a3fa621d9842e0d3f6f9291aeb4677e0547817c10b12
        run: |
          python3 scripts/gate.py run . --run-area . --profile standard --round 1 \
            --mode advisory --artifact dist/release.tgz \
            --options-file "$RUNNER_TEMP/shipgate-options.json" \
            --residual-risk "Disposable non-UI reference service."
          python3 - <<'PY'
          import json
          d = json.load(open("shipgate-workdir/decision.json"))["decision"]
          assert d["semanticStatus"] == "FAILED", d["reasonCodes"]
          assert "SEM_CONVERGENCE_NOT_REACHED" in d["reasonCodes"], d["reasonCodes"]
          PY

      - name: Collect clean semantic round two and require PASSED
        id: decide
        env:
          SHIPGATE_EXEC_MODE: container
          SHIPGATE_RUNNER_IMAGE: python:3.12-bookworm@sha256:3cd9086bdb30f7c9bc08a3fa621d9842e0d3f6f9291aeb4677e0547817c10b12
        run: |
          python3 scripts/gate.py run . --run-area . --profile standard --round 2 \
            --mode enforce --artifact dist/release.tgz \
            --options-file "$RUNNER_TEMP/shipgate-options.json" \
            --residual-risk "Disposable non-UI reference service."
          python3 - <<'PY'
          import json, os
          doc = json.load(open("shipgate-workdir/decision.json"))
          assert doc["decision"]["semanticStatus"] == "PASSED"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("decision_digest=" + doc["decisionDigest"] + "\n")
          PY

      - name: Assemble the release candidate
        run: |
          mkdir -p candidate
          cp shipgate-workdir/decision.json candidate/decision.json
          cp dist/release.tgz candidate/release.tgz
          test "$(find candidate -maxdepth 1 -type f ! -name decision.json | wc -l)" = "1"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: candidate/release.tgz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate
          path: candidate/
          if-no-files-found: error

      - name: Upload semantic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-evidence
          path: shipgate-workdir/
          if-no-files-found: warn

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - name: Deploy the gated candidate
        run: |
          echo "deployed $GITHUB_SHA run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
          echo "artifact=${{ needs.build.outputs.artifact_digest }}"
          echo "decision=${{ needs.build.outputs.decision_digest }}"
