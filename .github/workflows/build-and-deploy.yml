# Target-side: build -> DECIDE -> attest -> deploy through a gated environment.
#
# WHAT CHANGED AND WHY. The v4.2.2 field kit shipped a target workflow that built and
# attested an artifact but never ran ship-gate, so the `release-candidate` artifact carried
# no `decision.json`. The reference verifier's very first layout check hard-requires one:
#
#     test -f candidate/decision.json || { echo "candidate/decision.json missing"; exit 1; }
#
# so the two shipped workflows could never compose. This one produces the decision through
# ship-gate's supported public CLI — `gate.py run` — and uploads exactly the layout the
# verifier enforces: decision.json plus EXACTLY ONE release file.
#
# Actions pinned by immutable commit SHA (verify pins on adoption).
name: build and deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "deployment environment"
        required: false
        default: "production"

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_digest: ${{ steps.digest.outputs.sha256 }}
      decision_digest: ${{ steps.decide.outputs.decision_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # ship-gate reads git state from .git directly; a shallow clone gives it a
          # commit it cannot resolve, and subject.commit is a binding the verifier checks.
          fetch-depth: 0

      - name: Build the release artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          echo "ship-gate validation artifact $GITHUB_SHA" > dist/note.txt
          tar -czf dist/release.tgz dist/note.txt
          rm -f dist/note.txt

      - name: Record the artifact digest
        id: digest
        run: |
          set -euo pipefail
          SHA=$(sha256sum dist/release.tgz | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "release.tgz sha256 = $SHA"

      # THE DECISION. `--artifact` is what binds subject.artifactDigest to the exact bytes
      # uploaded below, so the verifier's recomputed digest has something to agree with.
      #
      # `--mode advisory` keeps THIS step green while the decision on disk still records the
      # truth. That is not a weakening: mode changes only whether this process blocks, never
      # what the decision says (gate.py:123-128). A demo repository cannot satisfy the
      # standard profile's 13 required evidence kinds, so this decision is honestly FAILED,
      # and the authority path downstream refuses it with AUT_SEMANTIC_NOT_PASSED rather
      # than attesting something that did not pass on the merits.
      #
      # `--static-only` keeps the run hermetic: no target code executes, so no containment
      # boundary is required and nothing reaches the network.
      - name: Produce the ship-gate decision (public CLI)
        id: decide
        run: |
          set -euo pipefail
          python3 scripts/gate.py run . \
            --run-area . \
            --profile standard \
            --static-only \
            --mode advisory \
            --artifact dist/release.tgz \
            --residual-risk "Field-validation target. Static collectors only; this repository is a deployment fixture, not a product."
          test -f shipgate-workdir/decision.json
          DD=$(python3 -c "import json;print(json.load(open('shipgate-workdir/decision.json'))['decisionDigest'])")
          echo "decision_digest=$DD" >> "$GITHUB_OUTPUT"
          echo "decision digest = $DD"

      # THE LAYOUT THE VERIFIER ENFORCES: decision.json + exactly one release file.
      - name: Assemble the release candidate
        run: |
          set -euo pipefail
          mkdir -p candidate
          cp shipgate-workdir/decision.json candidate/decision.json
          cp dist/release.tgz candidate/release.tgz
          echo "candidate/ contents:"; ls -1 candidate
          test "$(find candidate -maxdepth 1 -type f ! -name decision.json | wc -l)" = "1"

      - name: Attest build provenance (GitHub artifact attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: candidate/release.tgz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: candidate/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Deploy (the gated act itself)
        run: |
          echo "deployed $GITHUB_SHA run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT to ${{ inputs.environment }}"
          echo "artifact sha256 = ${{ needs.build.outputs.artifact_digest }}"
          echo "decision digest = ${{ needs.build.outputs.decision_digest }}"
